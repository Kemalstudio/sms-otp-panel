# -Djava.net.preferIPv4Stack: some networks advertise IPv6 routes that do not
# actually work, and Gradle then fails artifact downloads with
# "Network is unreachable: getsockopt" while metadata still resolves.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
