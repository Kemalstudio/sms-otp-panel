; Воркер очереди и планировщик под supervisor.
;
; Без этого шлюз не работает вообще: отправка кодов и доставка вебхуков живут
; в очереди, а уборки и проверка здоровья — в планировщике. Упавший воркер не
; бросает ошибок — коды просто копятся и протухают.
;
;   sudo cp deploy/supervisor/otp-gateway.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update

[program:otp-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/otp-gateway/artisan queue:work redis --queue=default --sleep=3 --tries=3 --backoff=10 --max-time=3600
directory=/var/www/otp-gateway
autostart=true
autorestart=true
; Воркеров больше одного — в этом и смысл перехода с SQLite: они пишут
; одновременно, и Postgres это выдерживает.
numprocs=2
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/otp-gateway/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
; Перезапуск по --max-time даёт свежий процесс раз в час: утечки памяти в
; долгоживущем PHP — обычное дело.
stopwaitsecs=30

[program:otp-scheduler]
; Альтернатива системному cron: один процесс, который сам будит планировщик
; раз в минуту. Удобно, когда cron на сервере недоступен.
command=php /var/www/otp-gateway/artisan schedule:work
directory=/var/www/otp-gateway
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/otp-gateway/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[group:otp-gateway]
programs=otp-queue,otp-scheduler
